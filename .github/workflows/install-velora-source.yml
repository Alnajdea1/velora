name: Install complete Velora theme source

on:
  push:
    paths:
      - '.github/workflows/install-velora-source.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace flattened files with the validated theme
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- src scripts public .vscode
          rm -f -- .npmrc CHANGELOG.md Lavender-Card-Prototype.html Velora-Lavender-Approved-Prototype.html announcement.twig app.css app.js aura-explorer.twig cart.twig closing.twig editorial-story.twig filters-sheet.twig fonts.css footer.twig gift-composer.twig header.twig hero.twig index.twig journal.twig loyalty.twig master.twig mobile-nav.twig mood-shopping.twig note-bloom.twig notifications.twig page-single.twig product-card.twig profile.twig routine-path.twig search-overlay.twig single.twig support.js thank-you.twig validate-theme.mjs wishlist.twig pnpm-lock.yaml pnpm-workspace.yaml postcss.config.js tailwind.config.js webpack.config.js
          cat > /tmp/velora-source.zip <<'VELORA_ARCHIVE'
