<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="direction:{{ dir }};font-family:Almarai,system-ui,sans-serif;position:relative;display:flex;flex-direction:column;gap:14px;padding:14px 14px 18px;border-radius:28px;background:#FCFBFF;box-shadow:{{ shadow }};transform:{{ lift }};transition:transform .5s cubic-bezier(.22,.9,.25,1),box-shadow .5s ease" onMouseEnter="{{ over }}" onMouseLeave="{{ out }}">
  <div style="position:relative;overflow:hidden;border-radius:{{ mediaRadius }};aspect-ratio:4/5;background:#F1ECFF;transition:border-radius .6s cubic-bezier(.22,.9,.25,1)">
    <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 12%,#FFFFFF 0%,{{ tone1 }} 46%,{{ tone2 }} 100%);opacity:{{ o1 }};transition:opacity .6s ease"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 88%,#FFFFFF 0%,#DCE6D8 40%,#BACBB5 100%);opacity:{{ o2 }};transition:opacity .6s ease"></div>
    <div style="position:absolute;inset:0;display:grid;place-items:center">
      <div style="display:flex;flex-direction:column;align-items:center;transform:{{ bottleLift }};transition:transform .7s cubic-bezier(.22,.9,.25,1)">
        <div style="width:26px;height:22px;border-radius:7px 7px 4px 4px;background:rgba(38,24,56,.55)"></div>
        <div style="width:13px;height:16px;background:rgba(38,24,56,.35)"></div>
        <div style="width:104px;height:126px;border-radius:22px 22px 30px 30px;background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.28));box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset -14px 0 26px rgba(118,87,232,.16),0 22px 34px -18px rgba(38,24,56,.4);backdrop-filter:blur(2px)"></div>
      </div>
    </div>
    <div style="position:absolute;top:12px;inset-inline-start:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">
      <sc-if value="{{ p.badge }}" hint-placeholder-val="{{ true }}">
        <span style="padding:6px 12px;border-radius:999px;background:#261838;color:#FCFBFF;font-size:11px;font-weight:700;letter-spacing:.02em">{{ p.badge }}</span>
      </sc-if>
      <sc-if value="{{ p.soldout }}" hint-placeholder-val="{{ false }}">
        <span style="padding:6px 12px;border-radius:999px;background:rgba(252,251,255,.9);color:#71836C;font-size:11px;font-weight:700">{{ soldLabel }}</span>
      </sc-if>
    </div>
    <button type="button" onClick="{{ fav }}" style="position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border:0;cursor:pointer;border-radius:999px;background:rgba(252,251,255,.86);color:{{ favColor }};font-size:15px;display:grid;place-items:center;box-shadow:0 8px 20px -12px rgba(38,24,56,.5)" style-hover="background:#FCFBFF;transform:scale(1.06)">♥</button>
    <div style="position:absolute;inset-inline:12px;bottom:12px;opacity:{{ qaOpacity }};transform:{{ qaLift }};transition:opacity .4s ease,transform .5s cubic-bezier(.22,.9,.25,1)">
      <button type="button" onClick="{{ add }}" disabled="{{ p.soldout }}" style="width:100%;border:0;cursor:{{ addCursor }};padding:13px 16px;border-radius:16px;background:{{ addBg }};color:{{ addFg }};font-family:Almarai,sans-serif;font-size:13px;font-weight:800;letter-spacing:.01em" style-hover="filter:brightness(1.08)">{{ addLabel }}</button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:7px;padding-inline:4px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font-family:Syne,sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#71836C">{{ p.family }}</span>
      <span style="font-size:11px;color:#7657E8;font-weight:700;white-space:nowrap">★ {{ p.rating }}</span>
    </div>
    <h3 style="margin:0;font-family:'Reem Kufi',Almarai,sans-serif;font-size:19px;line-height:1.35;font-weight:500;color:#261838">{{ p.name }}</h3>
    <p style="margin:0;font-size:12.5px;line-height:1.6;color:#71836C">{{ p.sub }}</p>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:2px">
      <span style="font-family:Syne,sans-serif;font-size:19px;font-weight:700;color:#261838;white-space:nowrap">{{ p.price }}</span>
      <sc-if value="{{ p.old }}" hint-placeholder-val="{{ true }}">
        <span style="font-family:Syne,sans-serif;font-size:13px;color:#C9B8FF;text-decoration:line-through;white-space:nowrap">{{ p.old }}</span>
      </sc-if>
      <sc-if value="{{ p.off }}" hint-placeholder-val="{{ true }}">
        <span style="padding:3px 9px;border-radius:999px;background:#FF7C8B;color:#fff;font-size:11px;font-weight:800;white-space:nowrap">{{ p.off }}</span>
      </sc-if>
    </div>
    <sc-if value="{{ p.notes }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:4px;border-top:1px solid #F1ECFF;padding-top:9px">
        <button type="button" onClick="{{ toggleNotes }}" style="display:flex;align-items:center;gap:7px;background:none;border:0;padding:0;cursor:pointer;font-family:Almarai,sans-serif;font-size:12px;font-weight:700;color:#7657E8">
          <span style="display:inline-block;width:16px;height:16px;border-radius:999px;background:#F1ECFF;color:#7657E8;font-size:11px;line-height:16px;text-align:center;transform:{{ chev }};transition:transform .4s ease">›</span>{{ notesLabel }}
        </button>
        <div style="overflow:hidden;max-height:{{ notesH }};opacity:{{ notesO }};transition:max-height .5s cubic-bezier(.22,.9,.25,1),opacity .4s ease">
          <div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:9px">
            <sc-for list="{{ noteList }}" as="n" hint-placeholder-count="3">
              <span style="padding:5px 11px;border-radius:999px;background:#F1ECFF;color:#261838;font-size:11.5px">{{ n }}</span>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:470},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Product&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ar&quot;,&quot;en&quot;],&quot;default&quot;:&quot;ar&quot;,&quot;tsType&quot;:&quot;'ar'|'en'&quot;},&quot;faved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p:Product)=&gt;void&quot;},&quot;onFav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p:Product)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { h: false, open: false };
  renderVals() {
    const p = this.props.p || {};
    const ar = (this.props.lang || 'ar') === 'ar';
    const h = this.state.h, open = this.state.open;
    return {
      p, dir: ar ? 'rtl' : 'ltr',
      shadow: h ? '0 40px 70px -40px rgba(38,24,56,.45)' : '0 18px 40px -34px rgba(38,24,56,.35)',
      lift: h ? 'translateY(-6px)' : 'none',
      mediaRadius: h ? '150px 150px 22px 22px' : '22px 22px 22px 22px',
      tone1: p.tone1 || '#F1ECFF', tone2: p.tone2 || '#C9B8FF',
      o1: h ? 0 : 1, o2: h ? 1 : 0,
      bottleLift: h ? 'translateY(-10px) scale(1.05) rotate(-2deg)' : 'none',
      qaOpacity: h ? 1 : 0, qaLift: h ? 'translateY(0)' : 'translateY(14px)',
      addBg: p.soldout ? '#F1ECFF' : '#7657E8', addFg: p.soldout ? '#C9B8FF' : '#FCFBFF',
      addCursor: p.soldout ? 'not-allowed' : 'pointer',
      addLabel: p.soldout ? (ar ? 'أبلغني عند التوفر' : 'Notify me') : (ar ? 'إضافة سريعة' : 'Quick add'),
      soldLabel: ar ? 'نفذت الكمية' : 'Sold out',
      notesLabel: ar ? 'مقاطع العطر' : 'Fragrance notes',
      noteList: (p.notes || '').split('،').map(s => s.trim()).filter(Boolean),
      notesH: open ? '90px' : '0px', notesO: open ? 1 : 0,
      chev: open ? 'rotate(90deg)' : (ar ? 'rotate(180deg)' : 'none'),
      favColor: this.props.faved ? '#FF7C8B' : '#C9B8FF',
      over: () => this.setState({ h: true }), out: () => this.setState({ h: false }),
      toggleNotes: () => this.setState(s => ({ open: !s.open })),
      add: () => { if (!p.soldout && this.props.onAdd) this.props.onAdd(p); },
      fav: () => { if (this.props.onFav) this.props.onFav(p); }
    };
  }
}
</script>
</body>
</html>
